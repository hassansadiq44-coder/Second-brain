async function saveEntry(form){const section=form.dataset.section,id=form.dataset.id;const previous=id?viewById(id):null;if(id&&!previous)throw Error('تعذر إيجاد السجل');if(secureSections.has(section)&&!masterKey)throw Error('افتح الخزنة أولاً');const data={};const fd=new FormData(form);for(const f of schemas[section]){let value=String(fd.get(f.name)||'').trim();if(f.required&&!value)throw Error('يرجى إكمال: '+f.label);if(f.type==='number'){value=Number(value);if(!Number.isFinite(value)||value<(f.min??0)||!Number.isInteger(value))throw Error('قيمة غير صالحة لحقل: '+f.label);}if(f.type==='url'&&value&&!canOpenUrl(value))throw Error('الرابط يجب أن يبدأ بـ https:// أو http://');data[f.name]=value;}
if(section==='expenses'&&Number(data.amount)<=0)throw Error('المصروف يجب أن يكون أكبر من صفر');const now=new Date().toISOString();let attachmentId=previous?.attachmentId||null;const file=fd.get('file');let newBlobRecord=null;
if(fd.has('removeAttachment'))attachmentId=null;
if(file instanceof File&&file.size){if(!fileSections.has(section))throw Error('المرفق غير متوقع');if(file.size>FILE_LIMIT)throw Error('الملف أكبر من 80MB. اختر ملفاً أصغر');attachmentId=uid();if(secureSections.has(section)){if(!masterKey)throw Error('افتح الخزنة أولاً');const iv=crypto.getRandomValues(new Uint8Array(12));const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},masterKey,await file.arrayBuffer());newBlobRecord={id:attachmentId,name:file.name,mime:file.type||'application/octet-stream',encrypted:true,iv:bytesToB64(iv),blob:new Blob([cipher],{type:'application/octet-stream'})};}else newBlobRecord={id:attachmentId,name:file.name,mime:file.type||'application/octet-stream',encrypted:false,blob:file};}
const keep=(previous&&!secureSections.has(section))?{...previous}:{};delete keep.encrypted;let row={...keep,id:id||uid(),section,createdAt:previous?.createdAt||now,updatedAt:now};if(section==='dailyTasks'||section==='todo')data.done=previous?.done||false;
if(secureSections.has(section)){const payload={...data,attachmentId};row.encrypted=await encryptJSON(payload);}else row={...row,...data,attachmentId};
// Keep entry, new attachment and removal of prior attachment atomic.
await new Promise((resolve,reject)=>{const tx=transaction(['entries','files','tombstones'],'readwrite');
 const es=tx.objectStore('entries'),fs=tx.objectStore('files');
 if(newBlobRecord)fs.put(newBlobRecord);

 if(previous?.attachmentId&&attachmentId!==previous.attachmentId){fs.delete(previous.attachmentId);tx.objectStore('tombstones').put({id:previous.attachmentId,kind:'file',updatedAt:now});}

form.reset();if(section==='quickNotes')captureDraft='';closeModal();await refresh();if(section==='todo')await syncNativeTodo(viewById(row.id)).catch(err=>toast('تم حفظ المهمة لكن تنبيه الهاتف لم يُجدول: '+err.message,true));touched();toast(id?'تم تحديث السجل':'تم حفظ السجل بنجاح');}

 if(row.done&&row.section==='todo'&&row.repeat&&row.repeat!=='بدون'&&row.due){const due=nextRepeatDue(row.due,row.repeat);if(due){next={...row,id:uid(),done:false,due,createdAt:row.updatedAt,updatedAt:row.updatedAt};await putRow('entries',next);}}

document.addEventListener('input',e=>{if(e.target?.id==='smartCommandInput'){smartDraft=e.target.value;smartPrediction=null;const pre=$('#smartPreview');if(pre)pre.innerHTML='<p class="hint">النص تغيّر؛ اضغط «تحليل وتصنيف» لإعادة التقييم.</p>';}});
document.addEventListener('change',e=>{if(e.target?.id==='smartSectionSelect'&&smartPrediction){
 const sec=e.target.value;if(!smartGroups.some(x=>x[0]===sec))return;
 const candidate=classifyCommand(smartPrediction.original,new Date(),sec)||smartPrediction;candidate.section=sec;if(sec!==smartPrediction.section)candidate.warnings=['غيّرت القسم يدوياً؛ أعدت تحليل الأمر لهذا القسم. راجع الحقول.',...candidate.warnings];
 smartPrediction=candidate;const pre=$('#smartPreview');if(pre)pre.innerHTML=smartPreviewHtml(candidate);
 }});
const prevSmartSaveEntry=saveEntry;
saveEntry=async function(form){const wasSmart=!!form.closest('#smartPreview');await prevSmartSaveEntry(form);if(wasSmart){smartDraft='';smartPrediction=null;if(activeSection==='dashboard')render();toast('✅ تم تنفيذ أمر الحفظ في القسم المناسب');}};
// Exposed only for automated parser testing; no sensitive data and no storage side effects.
window.SecondBrainSmartParser={classifyCommand,parseWhen,splitCommands,normalizeArabic};
})();

// ==== end Smart Capture 4.4 ====
init();
</script>
